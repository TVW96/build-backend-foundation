services:

  ####################
  # Service: DB
  ####################
  postgres:
    image: postgres:15
    container_name: manga-marketplace-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manga_marketplace
    ports:
      - 5432:5432
    volumes:
      - manga-marketplace-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
  
  ####################
  # Service: API
  ####################
  nestjs: 
    build:
      context: .
      # Build the final image
      target: final
    container_name: nestjs-api
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: manga_marketplace
    ports:
      - 3001:3001
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD",
        "node",
        "-e",
        "require('node:http').get('http://127.0.0.1:3001', (res) => process.exit(res.statusCode >= 200 && res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  manga-marketplace-data:
